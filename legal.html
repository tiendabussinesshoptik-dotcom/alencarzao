<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal — Alencarzao</title>
  <meta name="description" content="Disclaimer, privacy policy, terms of use and cookies.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .legal-wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 28px; }
    .legal-card { background: #fff; border-radius: 24px; padding: 36px; border: 1px solid rgba(230,52,127,.1); box-shadow: 0 10px 36px -16px rgba(230,52,127,.16); }
    .legal-card h2 { font-size: 1.3rem; margin-bottom: 14px; }
    .legal-card p { color: var(--ink); font-size: .96rem; margin-bottom: 12px; }
    .legal-card p:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <header class="site-header on-dark-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Alencarzao<span class="dot">.</span></a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html" data-i18n="nav.home">Home</a></li>
          <li><a href="about.html" data-i18n="nav.about">About</a></li>
          <li><a href="mediakit.html" data-i18n="nav.mediakit">Media Kit</a></li>
          <li><a href="shop.html" data-i18n="nav.shop">Shop</a></li>
          <li><a href="links.html" data-i18n="nav.links">Links</a></li>
          <li><a href="contact.html" data-i18n="nav.contact">Work With Me</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <div class="lang-switch">
          <button data-lang="en">EN</button>
          <button data-lang="es">ES</button>
          <button data-lang="pt">PT</button>
        </div>
        <button class="burger" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <h1 data-i18n="legal.hero.title">Legal</h1>
      <p data-i18n="legal.hero.sub">Disclaimer, privacy, terms of use and cookies.</p>
    </div>
  </section>

  <section>
    <div class="container legal-wrap">
      <div class="legal-card" id="disclaimer">
        <h2 data-i18n="legal.disc.title">Disclaimer — demo website</h2>
        <p data-i18n="legal.disc.p1"></p>
        <p data-i18n="legal.disc.p2"></p>
      </div>
      <div class="legal-card" id="privacy">
        <h2 data-i18n="legal.privacy.title">Privacy Policy</h2>
        <p data-i18n="legal.privacy.p1"></p>
        <p data-i18n="legal.privacy.p2"></p>
      </div>
      <div class="legal-card" id="terms">
        <h2 data-i18n="legal.terms.title">Terms of Use</h2>
        <p data-i18n="legal.terms.p1"></p>
      </div>
      <div class="legal-card" id="cookies">
        <h2 data-i18n="legal.cookies.title">Cookies</h2>
        <p data-i18n="legal.cookies.p1"></p>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border:none; padding-top:0;">
        <span>© 2026 <span data-i18n="footer.rights">All rights reserved.</span></span>
        <span data-i18n="footer.demo">Unofficial demo website — not affiliated with Geovanna Alencar.</span>
      </div>
    </div>
  </footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
