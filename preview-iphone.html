<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📱 Preview iPhone — Alencarzao</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; gap: 26px; padding: 40px 20px 60px;
      background: radial-gradient(800px 500px at 80% 0%, rgba(255,95,162,.3), transparent 60%),
                  linear-gradient(160deg, #16091a, #120b12 60%, #2a0f24);
      color: #fff;
    }
    h1 { font-family: 'Sora', sans-serif; font-size: 1.4rem; }
    h1 span { color: #ff5fa2; }
    .pages { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .pages button {
      font-family: 'Sora', sans-serif; font-weight: 600; font-size: .78rem; cursor: pointer;
      padding: 9px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.07); color: #fff; transition: .2s;
    }
    .pages button:hover { border-color: #ff5fa2; }
    .pages button.active { background: linear-gradient(120deg, #e6347f, #ff5fa2); border-color: transparent; }

    /* iPhone 15 Pro frame — 393×852 logical px */
    .iphone {
      width: 393px; height: 852px; flex-shrink: 0;
      border-radius: 55px; padding: 12px; background: #1a1a1c;
      box-shadow: 0 0 0 2px #3a3a3c, 0 0 0 5px #161618, 0 40px 90px -20px rgba(0,0,0,.8), 0 0 80px -30px rgba(255,95,162,.5);
      position: relative;
    }
    .iphone::before { /* dynamic island */
      content: ""; position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 10;
    }
    .iphone::after { /* home indicator */
      content: ""; position: absolute; bottom: 21px; left: 50%; transform: translateX(-50%);
      width: 130px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.85); z-index: 10; pointer-events: none;
    }
    .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: #000; }
    .screen iframe { width: 100%; height: 100%; border: none; }
    .hint { color: rgba(255,255,255,.55); font-size: .8rem; max-width: 420px; text-align: center; line-height: 1.6; }
    .hint code { background: rgba(255,255,255,.1); padding: 2px 8px; border-radius: 6px; }
    @media (max-width: 460px) {
      .iphone { transform: scale(.85); transform-origin: top center; margin-bottom: -120px; }
    }
  </style>
</head>
<body>
  <h1>📱 Preview iPhone — <span>Alencarzao</span></h1>
  <div class="pages">
    <button class="active" data-p="index.html">Home</button>
    <button data-p="about.html">About</button>
    <button data-p="mediakit.html">Media Kit</button>
    <button data-p="shop.html">Shop</button>
    <button data-p="links.html">Links</button>
    <button data-p="contact.html">Contact</button>
    <button data-p="admin/index.html">Admin</button>
  </div>
  <div class="iphone"><div class="screen"><iframe id="frame" src="index.html" title="Site preview"></iframe></div></div>
  <p class="hint">Vista a tamaño real de iPhone 15 (393×852). Para verlo en tu iPhone de verdad sin publicar: levanta <code>python3 -m http.server 8000</code> y abre <code>http://IP-de-tu-PC:8000</code> desde Safari (misma WiFi), o usa la URL de raw.githack del README.</p>
  <script>
    document.querySelectorAll(".pages button").forEach(b => b.addEventListener("click", () => {
      document.querySelectorAll(".pages button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      document.getElementById("frame").src = b.dataset.p;
    }));
  </script>
</body>
</html>
